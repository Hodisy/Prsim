<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Une horloge locale interactive dessinée avec des particules sur canvas." />
    <title>Dot Clock</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="clock-shell">
      <header class="topline">
        <a class="wordmark" href="./" aria-label="Réinitialiser Dot Clock">Dot Clock</a>
        <p id="date-label" class="date-label"></p>
      </header>

      <section class="clock-stage" aria-labelledby="screen-reader-time">
        <canvas id="dot-clock" aria-hidden="true"></canvas>
        <p id="screen-reader-time" class="sr-only" aria-live="polite"></p>
      </section>

      <footer class="controls">
        <p>Déplacez le curseur dans l’heure.</p>
        <div class="control-actions">
          <label class="toggle" for="hold-dispersed">
            <input id="hold-dispersed" type="checkbox" />
            <span class="toggle-track" aria-hidden="true"><span></span></span>
            <span>Garder dispersé</span>
          </label>
          <button id="shuffle" type="button">Disperser les points</button>
        </div>
      </footer>
    </main>
    <script type="module" src="./clock.js"></script>
  </body>
</html>
