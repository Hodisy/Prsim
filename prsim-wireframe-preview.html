<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PRSIM — Wireframe Preview</title>
  <style>
    :root {
      --ink: #111;
      --muted: #6d6d6d;
      --line: #b9b9b9;
      --line-strong: #777;
      --soft: #f1f1f1;
      --soft-2: #e5e5e5;
      --stage: #dedede;
      --paper: #fff;
      --shadow: 0 20px 60px rgba(0,0,0,.13);
      --radius: 12px;
      --appbar-h: 62px;
      --tabs-h: 52px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--stage);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    button { font: inherit; }

    .appbar {
      position: sticky;
      top: 0;
      z-index: 30;
      height: var(--appbar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: #111;
      color: #fff;
      border-bottom: 1px solid #333;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border: 1px solid #fff;
      font-weight: 800;
      letter-spacing: -.08em;
    }
    .brand-name { font-size: 15px; font-weight: 750; letter-spacing: .08em; }
    .brand-sub { color: #aaa; font-size: 11px; margin-top: 2px; }
    .view-toggle {
      display: flex;
      border: 1px solid #555;
      border-radius: 8px;
      overflow: hidden;
    }
    .view-toggle button {
      border: 0;
      padding: 8px 12px;
      background: transparent;
      color: #aaa;
      cursor: pointer;
    }
    .view-toggle button.active { background: #fff; color: #111; }

    .tabs-wrap {
      position: sticky;
      top: var(--appbar-h);
      z-index: 25;
      height: var(--tabs-h);
      display: flex;
      align-items: center;
      background: #fafafa;
      border-bottom: 1px solid #c9c9c9;
      overflow: hidden;
    }
    .tabs {
      width: 100%;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
      padding: 8px 18px;
    }
    .tab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      padding: 0 12px;
      border: 1px solid #c7c7c7;
      background: #fff;
      color: #444;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab:hover { border-color: #777; }
    .tab.active { background: #111; color: #fff; border-color: #111; }
    .tab-index { font-variant-numeric: tabular-nums; opacity: .65; font-size: 11px; }

    .workspace { padding: 22px 28px 46px; }
    .workspace-head {
      max-width: 1180px;
      margin: 0 auto 14px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
    }
    .workspace-title { font-size: 19px; font-weight: 750; margin: 0; }
    .workspace-sub { color: #5c5c5c; margin-top: 5px; font-size: 12px; }
    .sequence {
      max-width: 1180px;
      margin: 0 auto 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .sequence-chip {
      padding: 6px 9px;
      background: rgba(255,255,255,.65);
      border: 1px solid #c6c6c6;
      border-radius: 6px;
      color: #555;
      font-size: 11px;
    }
    .sequence-arrow { color: #777; align-self: center; }

    .stage {
      width: 100%;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 18px;
      border: 1px solid #c5c5c5;
      border-radius: 14px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.16) 1px, transparent 1px) 0 0 / 20px 20px,
        linear-gradient(rgba(255,255,255,.16) 1px, transparent 1px) 0 0 / 20px 20px,
        #d7d7d7;
      min-height: calc(100vh - 210px);
    }
    .canvas {
      flex: 0 0 auto;
      background: var(--paper);
      box-shadow: var(--shadow);
      transition: width .2s ease;
      overflow: hidden;
    }
    .canvas.desktop { width: 1180px; }
    .canvas.mobile { width: 390px; }

    /* Shared wireframe primitives */
    .shop-page, .library-page { background: #fff; min-height: 760px; }
    .site-header {
      height: 68px;
      display: grid;
      grid-template-columns: 160px 1fr 170px;
      align-items: center;
      padding: 0 38px;
      border-bottom: 1px solid var(--line);
      gap: 28px;
    }
    .site-header.minimal { grid-template-columns: 160px 1fr 90px; }
    .logo-box {
      width: 102px; height: 30px;
      border: 2px solid var(--ink);
      display: grid; place-items: center;
      font-weight: 800;
      letter-spacing: .18em;
      font-size: 11px;
    }
    .nav-lines { display: flex; justify-content: center; gap: 24px; }
    .nav-line { width: 48px; height: 7px; background: #d2d2d2; border-radius: 10px; }
    .header-icons { display: flex; justify-content: flex-end; gap: 12px; }
    .icon-box { width: 26px; height: 26px; border: 1px solid #8b8b8b; border-radius: 50%; }

    .wf-section {
      position: relative;
      padding: 64px 56px;
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .wf-section.compact { padding-top: 42px; padding-bottom: 42px; }
    .wf-section.soft { background: #f7f7f7; }
    .wf-section.dark { background: #171717; color: #fff; border-top-color: #444; }
    .wf-label {
      position: absolute;
      top: 12px;
      left: 14px;
      font-size: 9px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #777;
      background: rgba(255,255,255,.88);
      border: 1px solid #c7c7c7;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .dark .wf-label { background: #222; color: #aaa; border-color: #555; }
    .section-kicker {
      font-size: 10px;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 12px;
    }
    .dark .section-kicker { color: #aaa; }
    .section-title {
      width: min(540px, 100%);
      height: 30px;
      background: #232323;
      margin-bottom: 16px;
    }
    .dark .section-title { background: #f0f0f0; }
    .section-title.center { margin-left: auto; margin-right: auto; }
    .section-subtitle {
      width: min(420px, 100%);
      height: 10px;
      background: #c9c9c9;
      margin-bottom: 26px;
    }
    .section-subtitle.center { margin-left: auto; margin-right: auto; }
    .line-set { display: grid; gap: 9px; }
    .line { height: 8px; background: #cfcfcf; border-radius: 20px; }
    .dark .line { background: #555; }
    .line.w100 { width: 100%; }
    .line.w90 { width: 90%; }
    .line.w80 { width: 80%; }
    .line.w70 { width: 70%; }
    .line.w60 { width: 60%; }
    .line.w50 { width: 50%; }
    .line.w40 { width: 40%; }

    .media {
      position: relative;
      min-height: 260px;
      border: 1.5px solid var(--line-strong);
      background:
        linear-gradient(35deg, transparent 49.4%, #c5c5c5 49.5%, #c5c5c5 50.5%, transparent 50.6%),
        linear-gradient(-35deg, transparent 49.4%, #c5c5c5 49.5%, #c5c5c5 50.5%, transparent 50.6%),
        #ededed;
      display: grid;
      place-items: center;
      color: #777;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      overflow: hidden;
    }
    .media.dark-media { background-color: #2a2a2a; border-color: #666; color: #aaa; }
    .media.tall { min-height: 470px; }
    .media.medium { min-height: 360px; }
    .media.short { min-height: 170px; }
    .media.square { aspect-ratio: 1/1; min-height: 0; }
    .media.portrait { aspect-ratio: 3/4; min-height: 0; }
    .media.landscape { aspect-ratio: 16/9; min-height: 0; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; align-items: center; }
    .grid-2.equal { align-items: stretch; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .stack { display: grid; gap: 18px; }
    .centered { text-align: center; }

    .cta {
      height: 48px;
      min-width: 190px;
      padding: 0 22px;
      border: 2px solid #111;
      background: #111;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-top: 24px;
    }
    .cta.outline { color: #111; background: #fff; border-width: 1px; }
    .dark .cta { background: #fff; color: #111; border-color: #fff; }
    .cta-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .micro-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .micro-pill { height: 28px; min-width: 90px; border: 1px solid #aaa; border-radius: 999px; background: #f4f4f4; }

    .metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .metric-card {
      min-height: 150px;
      border: 1px solid var(--line-strong);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fff;
    }
    .metric-number { height: 34px; width: 60%; background: #222; }
    .metric-caption { height: 8px; width: 80%; background: #cfcfcf; }

    .review-card {
      min-height: 190px;
      border: 1px solid #999;
      padding: 22px;
      background: #fff;
    }
    .stars { display: flex; gap: 4px; margin-bottom: 18px; }
    .star { width: 11px; height: 11px; background: #222; clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 94%,50% 72%,21% 94%,32% 57%,2% 35%,39% 35%); }
    .avatar { width: 34px; height: 34px; border: 1px solid #777; border-radius: 50%; background: #ececec; }
    .review-author { display: flex; gap: 10px; align-items: center; margin-top: 20px; }

    .table { border: 1px solid #999; }
    .table-row {
      display: grid;
      grid-template-columns: 1.5fr repeat(4, 1fr);
      min-height: 50px;
      border-bottom: 1px solid #c2c2c2;
    }
    .table-row:last-child { border-bottom: 0; }
    .table-row > div { padding: 15px; border-right: 1px solid #c2c2c2; display: flex; align-items: center; }
    .table-row > div:last-child { border-right: 0; }
    .table-row.selected { background: #e7e7e7; outline: 2px solid #111; outline-offset: -2px; }
    .cell-line { height: 7px; background: #bfbfbf; width: 70%; border-radius: 10px; }
    .cell-check { width: 18px; height: 18px; border: 2px solid #111; border-radius: 50%; position: relative; }
    .cell-check::after { content: ""; width: 7px; height: 4px; border-left: 2px solid #111; border-bottom: 2px solid #111; transform: rotate(-45deg); position: absolute; left: 4px; top: 4px; }

    .timeline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; position: relative; margin-top: 28px; }
    .timeline::before { content: ""; position: absolute; top: 17px; left: 16%; right: 16%; height: 2px; background: #777; }
    .timeline-step { position: relative; z-index: 1; text-align: center; }
    .timeline-dot { width: 34px; height: 34px; border: 2px solid #111; border-radius: 50%; background: #fff; margin: 0 auto 14px; }
    .timeline-line { width: 70%; height: 8px; background: #bbb; margin: 0 auto; }

    .journey { display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; position: relative; margin: 34px 0 10px; }
    .journey::before { content: ""; height: 2px; background: #777; position: absolute; left: 10%; right: 10%; top: 22px; }
    .journey-stop { position: relative; z-index: 1; text-align: center; }
    .journey-icon { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #111; background: #fff; margin: 0 auto 12px; }

    .product-card { border: 1px solid #999; padding: 12px; background: #fff; position: relative; }
    .product-card.featured { border: 2px solid #111; transform: translateY(-8px); }
    .product-card .media { min-height: 150px; }
    .product-card .price-line { width: 45%; height: 18px; background: #222; margin: 14px 0 10px; }
    .badge { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); background: #111; color: #fff; padding: 5px 9px; font-size: 8px; letter-spacing: .12em; white-space: nowrap; }

    .classic-hero {
      display: grid;
      grid-template-columns: 1.18fr .82fr;
      gap: 42px;
      padding: 42px 48px 58px;
    }
    .gallery { display: grid; grid-template-columns: 74px 1fr; gap: 14px; }
    .thumbs { display: grid; gap: 10px; align-content: start; }
    .thumb { height: 70px; border: 1px solid #999; background: #eee; }
    .product-summary { padding: 10px 0; }
    .title-line { height: 34px; width: 88%; background: #222; margin-bottom: 12px; }
    .rating-line { display: flex; align-items: center; gap: 10px; margin: 12px 0 20px; }
    .rating-dots { display: flex; gap: 4px; }
    .rating-dots span { width: 10px; height: 10px; border-radius: 50%; background: #222; }
    .small-line { width: 110px; height: 8px; background: #bbb; }
    .price { height: 30px; width: 130px; background: #222; margin: 18px 0; }
    .swatches { display: flex; gap: 9px; margin: 14px 0; }
    .swatch { width: 34px; height: 34px; border: 1px solid #777; border-radius: 50%; background: #eee; }
    .swatch.active { outline: 2px solid #111; outline-offset: 2px; }
    .select-box { height: 46px; border: 1px solid #999; background: #fafafa; margin: 18px 0 0; }
    .reassurance { display: grid; gap: 9px; margin-top: 20px; }
    .reassurance-row { display: flex; gap: 9px; align-items: center; }
    .reassurance-icon { width: 18px; height: 18px; border: 1px solid #777; border-radius: 50%; }
    .reassurance-line { width: 180px; height: 7px; background: #c7c7c7; }

    .hero-split {
      min-height: 600px;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      border-bottom: 1px solid var(--line);
    }
    .hero-split.reverse { grid-template-columns: .9fr 1.1fr; }
    .hero-media { min-height: 600px; border: 0; border-right: 1px solid var(--line); }
    .hero-split.reverse .hero-media { border-right: 0; border-left: 1px solid var(--line); order: 2; }
    .hero-copy {
      padding: 76px 58px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .hero-eyebrow { height: 9px; width: 150px; background: #a9a9a9; margin-bottom: 20px; }
    .hero-title { display: grid; gap: 10px; margin-bottom: 20px; }
    .hero-title span { display: block; height: 40px; background: #171717; }
    .hero-title span:nth-child(1) { width: 96%; }
    .hero-title span:nth-child(2) { width: 74%; }
    .hero-title span:nth-child(3) { width: 55%; }
    .hero-description { width: 82%; display: grid; gap: 9px; margin-top: 8px; }
    .hero-description span { height: 9px; background: #c8c8c8; }
    .hero-description span:nth-child(2) { width: 86%; }
    .hero-description span:nth-child(3) { width: 64%; }
    .hero-meta { display: flex; gap: 12px; margin-top: 20px; }
    .hero-meta span { height: 28px; min-width: 90px; border: 1px solid #999; border-radius: 999px; background: #f4f4f4; }

    .hero-center {
      min-height: 650px;
      padding: 78px 58px 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      border-bottom: 1px solid var(--line);
    }
    .hero-center .hero-title { width: min(740px, 100%); align-items: center; }
    .hero-center .hero-title span { margin-left: auto; margin-right: auto; }
    .hero-center .hero-description { max-width: 540px; }
    .hero-product { width: min(700px, 100%); min-height: 330px; margin-top: 34px; }

    .hero-compat {
      display: grid;
      grid-template-columns: .95fr 1.05fr;
      min-height: 570px;
      border-bottom: 1px solid var(--line);
    }
    .compat-panel {
      padding: 78px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .compat-check {
      width: 62px; height: 62px;
      border: 3px solid #111;
      border-radius: 50%;
      margin-bottom: 24px;
      position: relative;
    }
    .compat-check::after { content:""; position:absolute; width:24px; height:12px; border-left:4px solid #111; border-bottom:4px solid #111; transform:rotate(-45deg); left:16px; top:18px; }
    .compat-title { display:grid; gap:10px; }
    .compat-title span { height: 42px; background:#171717; }
    .compat-title span:nth-child(2) { width: 70%; }
    .dimension-card { border: 2px solid #111; padding: 22px; margin: 26px 0 0; width: 85%; }
    .dimension-row { display:flex; justify-content:space-between; gap:16px; }
    .dimension-line { height: 26px; background:#222; flex:1; }
    .dimension-line.muted { background:#bfbfbf; }

    .hero-deadline {
      min-height: 560px;
      display: grid;
      grid-template-columns: 1fr .75fr;
      align-items: stretch;
      border-bottom: 1px solid var(--line);
    }
    .deadline-copy { padding: 80px 58px; display:flex; flex-direction:column; justify-content:center; }
    .deadline-banner { border: 3px solid #111; padding: 18px; margin-bottom: 26px; }
    .deadline-banner .big-line { height: 52px; background:#111; width: 92%; margin-bottom:10px; }
    .deadline-banner .small-line { width: 60%; }
    .deadline-side { padding: 32px; background:#f1f1f1; display:flex; align-items:center; }

    .hero-premium {
      min-height: 650px;
      padding: 80px 70px 52px;
      background:#151515;
      color:#fff;
      display:grid;
      grid-template-columns: .8fr 1.2fr;
      align-items:center;
      gap:70px;
      border-bottom:1px solid #444;
    }
    .hero-premium .media { min-height: 460px; background-color:#252525; border-color:#555; color:#aaa; }
    .hero-premium .hero-title span { background:#fff; }
    .hero-premium .hero-description span { background:#666; }
    .hero-premium .hero-eyebrow { background:#777; }

    .hero-technical {
      padding: 68px 56px 50px;
      border-bottom:1px solid var(--line);
      display:grid;
      grid-template-columns: 1fr .9fr;
      gap:44px;
      align-items:center;
    }
    .spec-strip { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid #888; margin:26px 0; }
    .spec-cell { padding:18px 12px; min-height:82px; border-right:1px solid #aaa; }
    .spec-cell:last-child { border-right:0; }
    .spec-big { height:24px; width:75%; background:#222; margin-bottom:10px; }
    .spec-small { height:7px; width:90%; background:#bbb; }

    .hero-social {
      min-height:600px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      border-bottom:1px solid var(--line);
    }
    .social-copy { padding:72px 55px; display:flex; flex-direction:column; justify-content:center; }
    .rating-giant { display:flex; gap:8px; align-items:end; margin:12px 0 24px; }
    .rating-number { width:150px; height:72px; background:#171717; }
    .rating-caption { width:110px; height:10px; background:#aaa; margin-bottom:8px; }

    /* Decision-first heroes */
    .decision-context {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 7px 10px;
      border: 1px solid #aaa;
      border-radius: 999px;
      color: #555;
      background: #fff;
      font-size: 9px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .decision-context::before { content:""; width:7px; height:7px; border-radius:50%; background:#111; }
    .decision-context .edit-context { padding-left:8px; border-left:1px solid #bbb; color:#111; }

    .hero-airline-decision {
      min-height: 620px;
      display: grid;
      grid-template-columns: 1.12fr .88fr;
      border-bottom: 1px solid var(--line);
      position: relative;
    }
    .airline-decision-visual { min-height:620px; border:0; border-right:1px solid var(--line); }
    .airline-decision-panel {
      padding: 58px 48px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      background:#fafafa;
    }
    .airline-card-top { display:flex; justify-content:space-between; align-items:center; gap:14px; margin:24px 0 18px; }
    .airline-wordmark {
      min-width: 136px;
      height: 42px;
      padding: 0 16px;
      border: 2px solid #111;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .14em;
    }
    .verified-pill { display:inline-flex; align-items:center; gap:7px; font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .verified-pill::before { content:"✓"; width:23px; height:23px; display:grid; place-items:center; border:2px solid #111; border-radius:50%; }
    .airline-question { display:grid; gap:9px; margin:0 0 22px; }
    .airline-question span { height:34px; background:#171717; }
    .airline-question span:last-child { width:72%; }
    .dimension-proof { border:2px solid #111; background:#fff; }
    .dimension-proof-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-bottom:1px solid #999; font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .dimension-proof-grid { display:grid; grid-template-columns:1fr 1fr; }
    .dimension-proof-value { padding:18px 14px; border-right:1px solid #aaa; }
    .dimension-proof-value:last-child { border-right:0; }

<body>
  <header class="appbar">
    <div class="brand">
      <div class="brand-mark">P</div>

        <div class="brand-sub">Selective commerce wireframes</div>
      </div>
    </div>
    <div class="view-toggle" role="group" aria-label="Format de prévisualisation">
      <button type="button" class="active" data-viewport="desktop">Desktop</button>

  <main class="workspace">
    <div class="workspace-head">

  <script>
    const L = (width = 'w100') => `<span class="line ${width}"></span>`;
    const lines = (arr = ['w100','w90','w70']) => `<div class="line-set">${arr.map(L).join('')}</div>`;
    const media = (label = 'Visuel', cls = '') => `<div class="media ${cls}"><span>${label}</span></div>`;

      return ({split,center,cards,table,review,timeline,metrics,ugc,packing,obstruction,price,airline,gift,journal,comments})[type] || split;
    }

    function patternCard(name,type) {
      return `<article class="pattern-card"><div class="pattern-name">${name}</div><div class="mini-frame">${miniPattern(type)}</div></article>`;

    function libraryPage() {

    const views = [

      {key:'p10', index:'10', label:'Amina', title:'Amina — voyage avec deux enfants', sub:'Accès rapide, mains libres, sous-siège.', sequence:['Hero accès','Hotspots','Sous-siège','Avis parent','CTA']},
      {key:'p11', index:'11', label:'Paul', title:'Paul — ingénieur · acheteur analytique', sub:'Specs, comparaison et preuve objective.', sequence:['Hero technique','Tableau','Tests','Avis expert','CTA']},
      {key:'p12', index:'12', label:'Léa', title:'Léa — Instagram · Barcelone', sub:'Style, projection et couleur.', sequence:['Hero lifestyle','Galerie','Packing week-end','UGC','CTA']},
      {key:'p13', index:'13', label:'Daniel', title:'Daniel — 68 ans · voyage aux États-Unis', sub:'Confiance, garantie et compatibilité.', sequence:['Hero confiance','Réassurance','Garantie','Compagnies','Avis 55+','CTA']},
      {key:'p14', index:'14', label:'Maya', title:'Maya — digital nomad · Asie', sub:'Laptop, pluie tropicale et usage long.', sequence:['Hero laptop','Protection','Tests météo','Journal nomade','CTA']},
      {key:'p15', index:'15', label:'Kevin', title:'Kevin — départ demain', sub:'Disponibilité immédiate. Rien d’autre.', sequence:['Hero deadline','3 faits','Timeline','CTA']}
    ];

    const tabs = document.getElementById('tabs');
    const canvas = document.getElementById('canvas');
    const titleEl = document.getElementById('view-title');
    const subEl = document.getElementById('view-sub');
    const sequenceEl = document.getElementById('sequence');

    function renderTabs() {
      tabs.innerHTML = views.map(v=>`<button class="tab" type="button" data-key="${v.key}"><span class="tab-index">${v.index}</span>${v.label}</button>`).join('');
      tabs.addEventListener('click', e => {
        const btn = e.target.closest('.tab');
        if (btn) selectView(btn.dataset.key);
      });
    }

    function selectView(key, updateHash=true) {
      const view = views.find(v=>v.key===key) || views[0];
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.key===view.key));
      const active = document.querySelector(`.tab[data-key="${view.key}"]`);
      active?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
      titleEl.textContent = view.title;
      subEl.textContent = view.sub;
      sequenceEl.innerHTML = view.sequence.map((s,i)=>`${i?'<span class="sequence-arrow">→</span>':''}<span class="sequence-chip">${s}</span>`).join('');
      canvas.innerHTML = pages[view.key]();
      if (updateHash) history.replaceState(null,'',`#${view.key}`);
      document.querySelector('.stage').scrollTop = 0;
      window.scrollTo({top:0,behavior:'instant'});
    }

    document.querySelectorAll('[data-viewport]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('[data-viewport]').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        canvas.classList.remove('desktop','mobile');
        canvas.classList.add(btn.dataset.viewport);
      });
    });

    window.addEventListener('keydown', e=>{
      if (!['ArrowLeft','ArrowRight'].includes(e.key)) return;
      const currentKey = location.hash.replace('#','') || 'library';
      let idx = views.findIndex(v=>v.key===currentKey);
      idx = e.key==='ArrowRight' ? Math.min(views.length-1,idx+1) : Math.max(0,idx-1);
      selectView(views[idx].key);
    });

    renderTabs();
    selectView(location.hash.replace('#','') || 'library', false);
  </script>
