<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="PRSIM — layouts e-commerce adaptatifs en wireframe et UI." />
    <title>PRSIM — Adaptive Commerce Preview</title>
    <link rel="stylesheet" href="./src/styles/app.css" />
    <link rel="stylesheet" href="./src/styles/wireframe.css" />
    <link rel="stylesheet" href="./src/styles/ui.css" />
    <link rel="stylesheet" href="./src/styles/brand.css" />
  </head>
  <body>
    <header class="appbar">
      <a class="app-identity" href="#brand" aria-label="Ouvrir la charte de marque">
        <span class="app-mark">P</span>
        <span><strong>PRSIM</strong><small>Adaptive commerce preview</small></span>
      </a>
      <div class="app-controls">
        <div class="control-group" role="group" aria-label="Mode de prévisualisation">
          <button type="button" data-preview-mode="wireframe">Wireframe</button>
          <button type="button" data-preview-mode="ui">UI</button>
        </div>
        <div class="control-group viewport-control" role="group" aria-label="Format de prévisualisation">
          <button type="button" data-viewport="desktop">Desktop</button>
          <button type="button" data-viewport="mobile">Mobile</button>
        </div>
      </div>
    </header>

    <div class="tabs-wrap">
      <nav id="tabs" class="tabs" aria-label="Pages du projet"></nav>
    </div>

    <main class="workspace">
      <div class="workspace-head">
        <div>
          <h1 id="view-title"></h1>
          <p id="view-sub"></p>
        </div>
        <span id="mode-status" class="mode-status"></span>
      </div>
      <div id="sequence" class="sequence" aria-label="Séquence de la page"></div>
      <div class="stage">
        <div id="canvas" class="canvas desktop mode-wireframe" aria-live="polite"></div>
      </div>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
