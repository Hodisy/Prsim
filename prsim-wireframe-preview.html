      <noscript>
        <section aria-labelledby="prsim-static-title">
          <h2 id="prsim-static-title">PRSIM — adaptive storefronts through WebMCP</h2>
          <p>PRSIM is a working commerce prototype in which a shopper's AI companion can adapt the product page already open in the browser. The website selects from merchant-approved layouts, product facts, imagery, evidence, offers and purchase controls.</p>
          <p>The experience begins with explicit purchase context, resolves the closest authored shopping scenario, and can then refine individual sections for airline fit, comparison, customer evidence, product questions, color, delivery, bundles, cart and checkout.</p>
          <p>PRSIM includes 21 commercial scenario seeds, four bag formats, four colorways, a merchant studio and a progressive WebMCP tool surface. It does not generate arbitrary interface or product claims.</p>
          <p><a href="/llms.txt">Read the structured project overview</a> or <a href="https://github.com/Hodisy/Prsim">inspect the source code on GitHub</a>.</p>
        </section>
